name: Build Android APK (HAMILHA)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public HTTPS backend URL (e.g. https://api.yourdomain.com)"
        required: false
        default: ""
      app_id:
        description: "Optional custom Android Application ID (leave blank for default)"
        required: false
        default: ""
  push:
    branches:
      - main
      - master
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable 3.29+)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter version & install dependencies
        working-directory: flutter_app
        run: |
          flutter --version
          flutter pub get

      - name: Run Flutter static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Configure optional release signing from GitHub Secrets
        id: signing
        working-directory: flutter_app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$(pwd)/release-keystore.jks" > key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured from GitHub Secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets configured; APK will use debug signing for direct testing."
          fi

      - name: Build Android APK
        working-directory: flutter_app
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          VAR_API_URL: ${{ vars.HAMILHA_API_URL }}
          INPUT_APP_ID: ${{ github.event.inputs.app_id }}
          VAR_APP_ID: ${{ vars.HAMILHA_APP_ID }}
        run: |
          API_URL="${INPUT_API_URL:-$VAR_API_URL}"
          APP_ID="${INPUT_APP_ID:-$VAR_APP_ID}"

          if [ -n "$APP_ID" ]; then
            printf '\nHAMILHA_APP_ID=%s\n' "$APP_ID" >> android/gradle.properties
          fi

          ARGS=(build apk --release)
          if [ -n "$API_URL" ]; then
            ARGS+=(--dart-define="HAMILHA_API_URL=${API_URL}")
          fi

          flutter "${ARGS[@]}"

      - name: Build Google Play AAB (only when release signing is configured)
        if: steps.signing.outputs.signed == 'true'
        working-directory: flutter_app
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          VAR_API_URL: ${{ vars.HAMILHA_API_URL }}
        run: |
          API_URL="${INPUT_API_URL:-$VAR_API_URL}"
          ARGS=(build appbundle --release)
          if [ -n "$API_URL" ]; then
            ARGS+=(--dart-define="HAMILHA_API_URL=${API_URL}")
          fi
          flutter "${ARGS[@]}"

      - name: Clean up temporary keystore files
        if: always()
        working-directory: flutter_app/android
        run: rm -f release-keystore.jks key.properties

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamilha-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Google Play AAB artifact (when signed)
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hamilha-android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
